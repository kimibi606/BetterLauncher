name: Release Launcher

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$version") {
            throw "Release tag does not match the package version."
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release commit must belong to main." }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm audit --audit-level=moderate
      - name: Build release
        run: npm run release:github
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-release
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/BetterLauncher-Setup-*.exe
            dist/BetterLauncher-Setup-*.exe.blockmap
            dist/latest.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-release
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          installer="release/BetterLauncher-Setup-$version.exe"
          test -f "$installer"
          test -f "$installer.blockmap"
          test -f release/latest.yml
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing published release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$installer" "$installer.blockmap" release/latest.yml \
            --title "BetterLauncher $version" --generate-notes --verify-tag
